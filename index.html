<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris Trade - Pro Exchange Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              bg: {
                DEFAULT: '#131722', // TradingView dark bg
                secondary: '#1e222d',
                tertiary: '#2a2e39',
              },
              accent: {
                DEFAULT: '#2962ff',
                hover: '#1e53e5',
              },
              trade: {
                up: '#089981',
                down: '#f23645',
              },
              text: {
                primary: '#d1d4dc',
                secondary: '#787b86',
              }
            },
            gridTemplateRows: {
              'layout': '48px 1fr 32px',
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #131722;
      }
      ::-webkit-scrollbar-thumb {
        background: #363a45;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4a4e5d;
      }
      body {
        background-color: #131722;
        color: #d1d4dc;
        overflow: hidden; /* App handles scroll */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
